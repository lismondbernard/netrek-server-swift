name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test

  linux:
    name: Linux
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test, with the server smoke test
        run: swift test
        env:
          NETREK_SMOKE_TEST: "1"
      - name: Build the release binary with the Swift runtime linked in
        run: swift build -c release --static-swift-stdlib
      - name: Smoke test the release binary
        run: NETREK_SERVER_BINARY="$PWD/.build/release/netrek-server-swift" swift test --filter ServerSmokeTests
        env:
          NETREK_SMOKE_TEST: "1"
